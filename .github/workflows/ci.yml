name: Lightweight checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed MoonBit release
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("toolchain.json"))["release"])')
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and check version
        run: |
          moon version --all
          moonc -v | grep -F 'v0.10.17+d971670cd'
          moon update
      - name: Explicit type format and public interface checks
        run: |
          moon check --target js
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Focused portable smoke tests
        run: moon test dnssd_test.mbt src/model src/wire src/cache src/engine src/replay --target js --filter 'smoke:*'
      - name: Independently parse Engine Known-Answer output
        run: moon test tests/protocol_probe --target js --filter 'smoke:*'
      - name: Compile Linux native transport probes
        run: moon build cmd/native_spike cmd/transport_spike cmd/moondiscover examples/http_connect examples/watch_events tests/native_cancel tests/resource_soak tests/security_fuzz --target native
      - name: Bounded native input fuzz with reproducible fixed and changing seeds
        run: |
          moon run scripts/security-fuzz.mbtx -- _build/native/debug/build/tests/security_fuzz/security_fuzz.exe 20261105 192
          moon run scripts/security-fuzz.mbtx -- _build/native/debug/build/tests/security_fuzz/security_fuzz.exe ${{ github.run_number }} 192
      - name: Keep fuzz reproducer and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fuzz-evidence
          path: .tools/security-fuzz-*.json
          include-hidden-files: true
      - name: Native ingress policy boundary tests
        run: moon test src/native --target native --filter 'smoke:*'
      - name: Bounded resource lifecycle smoke
        run: _build/native/debug/build/tests/resource_soak/resource_soak.exe 2
      - name: Consume public APIs from a separate local workspace
        run: python3 tests/interop/consumer_smoke.py --moon-home "$HOME/.moon" --version 0.2.0
      - name: Compile and verify offline browser replay callback
        run: |
          moon build examples/browser_replay --target js
          node examples/browser_replay/smoke.cjs _build/js/debug/build/examples/browser_replay/browser_replay.js
      - name: Three targeted semantic fault injections
        run: python3 tests/interop/mutation_smoke.py --moon-home "$HOME/.moon" --output .tools/mutation-ci.json
  windows-native-build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed project toolchain
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Compile Windows native transport probes
        shell: pwsh
        run: ./scripts/moon.ps1 build cmd/native_spike cmd/transport_spike cmd/moondiscover examples/http_connect examples/watch_events tests/native_cancel tests/resource_soak --target native
      - name: Bounded resource lifecycle smoke
        shell: pwsh
        run: ./_build/native/debug/build/tests/resource_soak/resource_soak.exe 2
      - name: Offline CLI smoke
        shell: pwsh
        run: python tests/interop/cli_smoke.py
      - name: Native ingress policy boundary tests
        shell: pwsh
        run: ./scripts/moon.ps1 test src/native --target native --filter 'smoke:*'
