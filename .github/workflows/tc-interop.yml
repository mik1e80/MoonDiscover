name: Two responder TC interoperability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tc-interop.yml
      - scripts/tc-interop.mbtx
      - scripts/tc-link.mbtx
      - tests/tc_interop/**
      - tests/interop/tc_publisher.py
      - tests/interop/requirements.txt
      - tests/protocol_probe/**
      - src/wire/**
      - src/native/**
      - moon.mod
      - toolchain.json
permissions:
  contents: read
jobs:
  tc-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain and responders
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("toolchain.json"))["release"])')
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y avahi-daemon avahi-utils iproute2
          sudo systemctl start dbus avahi-daemon
          python3 -m venv .venv
          .venv/bin/pip install -r tests/interop/requirements.txt
      - name: Build and run the focused multicast probe
        shell: bash
        run: |
          moon update
          moon build tests/tc_interop --target native
          dev=$(ip -j -4 route get 224.0.0.251 | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["dev"])')
          sudo ip addr add 192.0.2.242/32 dev "$dev"
          trap 'for alias in 192.0.2.253 192.0.2.252 192.0.2.251 192.0.2.250 192.0.2.249 192.0.2.248 192.0.2.247 192.0.2.246 192.0.2.245 192.0.2.244 192.0.2.243 192.0.2.242; do sudo ip addr del "$alias/32" dev "$dev" 2>/dev/null || true; done' EXIT
          sudo ip addr add 192.0.2.243/32 dev "$dev"
          sudo ip addr add 192.0.2.244/32 dev "$dev"
          sudo ip addr add 192.0.2.245/32 dev "$dev"
          sudo ip addr add 192.0.2.246/32 dev "$dev"
          sudo ip addr add 192.0.2.247/32 dev "$dev"
          sudo ip addr add 192.0.2.248/32 dev "$dev"
          sudo ip addr add 192.0.2.249/32 dev "$dev"
          sudo ip addr add 192.0.2.250/32 dev "$dev"
          sudo ip addr add 192.0.2.251/32 dev "$dev"
          sudo ip addr add 192.0.2.252/32 dev "$dev"
          sudo ip addr add 192.0.2.253/32 dev "$dev"
          moon run scripts/tc-interop.mbtx -- .venv/bin/python 192.0.2.242 192.0.2.243 192.0.2.244 192.0.2.245 192.0.2.246 192.0.2.247 192.0.2.248 192.0.2.249 192.0.2.250 192.0.2.251 192.0.2.252 192.0.2.253
      - name: Verify Browser retry under random query loss
        shell: bash
        run: |
          sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --query-retry
          sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --multi-query-retry
      - name: Compare random query loss with peer reception
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --random-query
      - name: Verify concurrent Browser retry under random loss and response reorder
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --advanced-response
      - name: Verify loss and reordering across an isolated virtual link
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --twelve
      - name: Verify response loss, restored delivery and delay
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --response
      - name: Verify Browser retry after two blocked responses
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --retry
      - name: Sample random response loss
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --random-response
      - name: Verify twelve queriers under response link faults
        shell: bash
        run: sudo --preserve-env=HOME,PATH "$HOME/.moon/bin/moon" run scripts/tc-link.mbtx -- .venv/bin/python "$(git rev-parse HEAD)" --multi-response
      - name: Retain observations and publisher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-responder-tc-evidence
          path: |
            .tools/tc-interop.json
            .tools/tc-link.json
            .tools/tc-response-link.json
            .tools/tc-retry-link.json
            .tools/tc-random-response-link.json
            .tools/tc-random-query-link.json
            .tools/tc-query-retry-link.json
            .tools/tc-multi-query-retry-link.json
            .tools/tc-multi-response-link.json
            .tools/tc-advanced-response-link.json
            .tools/tc-*.log
          include-hidden-files: true
